extends: rq5.yaml

evaluation:
  bootstrap_repetitions: 50
  minimum_subgroup_rows: 20
  calibration_bins: [5, 10, 15]

rq5:
  manifest:
    path: artifacts/bdd100k_diagnostic_manifest.json
    expected_test_partition: diagnostic

  fusion:
    minimum_selection_samples: 10
    minimum_component_calibration_samples: 10
    minimum_policy_calibration_samples: 10

  realtime:
    benchmark_repetitions: 25
    benchmark_max_images: 8

  outputs:
    root: RQ5/outputs/mini_e2e
    models: RQ5/models/mini_e2e
    train_features: RQ5/outputs/mini_e2e/features_train.parquet
    validation_features: RQ5/outputs/mini_e2e/features_validation.parquet
    test_features: RQ5/outputs/mini_e2e/features_test.parquet
    train_image_summary: RQ5/outputs/mini_e2e/images_train.parquet
    validation_image_summary: RQ5/outputs/mini_e2e/images_validation.parquet
    test_image_summary: RQ5/outputs/mini_e2e/images_test.parquet
    metrics: RQ5/outputs/mini_e2e/metrics.json
    bootstrap: RQ5/outputs/mini_e2e/bootstrap_metrics.parquet
    predictions: RQ5/outputs/mini_e2e/calibrated_predictions.parquet
